<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hoja A4 con nueve reversos Circuit Core para las cartas coleccionables de ROBI.">
    <title>ROBI · Imprimir reversos</title>
    <link rel="preload" as="image" href="./images/backs/robi-card-back-circuit-core.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="back-print-page">
    <header class="hero">
      <div class="hero__glow hero__glow--one" aria-hidden="true"></div>
      <div class="hero__glow hero__glow--two" aria-hidden="true"></div>

      <div class="shell hero__inner">
        <div class="brand-lockup">
          <span class="brand-lockup__eyebrow">REVERSO CIRCUIT CORE</span>
          <h1><span>ROBI</span> · REVERSOS</h1>
          <p>Nueve reversos alineados con las hojas de cartas.</p>
        </div>

        <div class="hero__actions">
          <a class="print-button print-button--secondary" href="./index.html">Volver a las cartas</a>
          <button class="print-button" type="button" onclick="window.print()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/>
            </svg>
            Imprimir reversos
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="collection shell" aria-labelledby="backs-title">
        <div class="section-heading">
          <div>
            <span class="section-heading__kicker">HOJA A4 · 3 × 3</span>
            <h2 id="backs-title">Reverso Circuit Core</h2>
          </div>
          <p>Imprime al 100 %. No uses “Ajustar a la página”.</p>
        </div>

        <div class="sheet-stack">
          <div class="sheet-wrapper">
            <p class="sheet-label">HOJA DE REVERSOS · 9 CARTAS</p>
            <section class="print-sheet" aria-label="Hoja A4 con nueve reversos">
              <div class="sheet-grid" role="list">
                <article class="fact-card card-back" role="listitem"><img class="card-back__image" src="./images/backs/robi-card-back-circuit-core.png" alt="Reverso Circuit Core de ROBI"></article>
                <article class="fact-card card-back" role="listitem"><img class="card-back__image" src="./images/backs/robi-card-back-circuit-core.png" alt="Reverso Circuit Core de ROBI"></article>
                <article class="fact-card card-back" role="listitem"><img class="card-back__image" src="./images/backs/robi-card-back-circuit-core.png" alt="Reverso Circuit Core de ROBI"></article>
                <article class="fact-card card-back" role="listitem"><img class="card-back__image" src="./images/backs/robi-card-back-circuit-core.png" alt="Reverso Circuit Core de ROBI"></article>
                <article class="fact-card card-back" role="listitem"><img class="card-back__image" src="./images/backs/robi-card-back-circuit-core.png" alt="Reverso Circuit Core de ROBI"></article>

                <article class="fact-card card-back" role="listitem"><img class="card-back__image" src="./images/backs/robi-card-back-circuit-core.png" alt="Reverso Circuit Core de ROBI"></article>
                <article class="fact-card card-back" role="listitem"><img class="card-back__image" src="./images/backs/robi-card-back-circuit-core.png" alt="Reverso Circuit Core de ROBI"></article>
                <article class="fact-card card-back" role="listitem"><img class="card-back__image" src="./images/backs/robi-card-back-circuit-core.png" alt="Reverso Circuit Core de ROBI"></article>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
