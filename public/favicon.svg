<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ROBI favicon — head only.
       Brand: white helmet, black visor, cyan eyes (#6ee7ff = --accent).
       Dark rounded background (#0b1020 = --bg / theme-color) so the
       favicon reads on both light and dark browser tabs. -->
  <rect width="64" height="64" rx="14" fill="#0b1020"/>

  <!-- Antenna: stem + cyan tip -->
  <line x1="32" y1="6" x2="32" y2="14" stroke="#6ee7ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="6" r="3.5" fill="#6ee7ff"/>

  <!-- Helmet (white) -->
  <rect x="8" y="12" width="48" height="46" rx="14" fill="#f5f7fa" stroke="#0b1020" stroke-width="1.5"/>

  <!-- Visor (dark, fills most of the face) -->
  <rect x="14" y="20" width="36" height="28" rx="9" fill="#0b1020"/>

  <!-- Eyes: cyan ovals, vertical (matches the sprite) -->
  <ellipse cx="24" cy="33" rx="4" ry="6.5" fill="#6ee7ff"/>
  <ellipse cx="40" cy="33" rx="4" ry="6.5" fill="#6ee7ff"/>

  <!-- Smile: tiny cyan curve -->
  <path d="M 26 41 Q 32 45 38 41" stroke="#6ee7ff" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>